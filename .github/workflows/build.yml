name: Build VSTO Word Add-in

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write 

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Install Office Development Workload
      run: |
        Write-Host "Locating Visual Studio installation..."
        $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
        $installPath = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.CoreEditor -property installationPath
        
        if (-not $installPath) { 
            Write-Error "Visual Studio not found on the GitHub runner."
            exit 1 
        }
        
        Write-Host "Found VS at: $installPath"
        Write-Host "Installing VSTO Workload (this may take 2-4 minutes)..."
        
        $installer = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vs_installer.exe"
        $arguments = "modify --installPath `"$installPath`" --add Microsoft.VisualStudio.Workload.Office --quiet --norestart"
        
        $process = Start-Process -FilePath $installer -ArgumentList $arguments -Wait -NoNewWindow -PassThru
        
        if ($process.ExitCode -ne 0 -and $process.ExitCode -ne 3010) { 
            Write-Error "Installer failed with exit code $($process.ExitCode)"
            exit 1 
        }
        Write-Host "VSTO Workload installed successfully!"
      shell: powershell

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2

    - name: Setup NuGet
      uses: nuget/setup-nuget@v2

    - name: Restore NuGet Packages
      run: nuget restore WordPowerToolsAddin.sln

    - name: Build VSTO Project
      run: |
        $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
        $vsPath = & $vswhere -latest -property installationPath
        
        Write-Host "Dynamically searching for Office.targets file..."
        $targetsFile = Get-ChildItem -Path "$vsPath\MSBuild\Microsoft\VisualStudio" -Filter "Microsoft.VisualStudio.Tools.Office.targets" -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
        
        if (-not $targetsFile) {
            Write-Error "Office.targets file not found even after workload installation!"
            exit 1
        }
        
        $vsToolsPath = $targetsFile.Directory.Parent.FullName
        $vsVersion = $targetsFile.Directory.Parent.Name.Replace('v', '')
        
        Write-Host "Dynamically forced VSToolsPath to: $vsToolsPath"
        Write-Host "Dynamically forced VisualStudioVersion to: $vsVersion"
        
        msbuild WordPowerToolsAddin\WordPowerToolsAddin.csproj /p:Configuration=Release /p:Platform="AnyCPU" /p:VisualStudioVersion=$vsVersion /p:VSToolsPath="$vsToolsPath"
      shell: powershell

    - name: Publish Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: WordPowerTools-Addin-Artifacts
        path: WordPowerToolsAddin\bin\Release\

    - name: Zip Files for Release
      run: Compress-Archive -Path WordPowerToolsAddin\bin\Release\* -DestinationPath WordPowerTools-Addin-Release.zip
      shell: powershell

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
      with:
        tag_name: v1.0.${{ github.run_number }}
        name: Release v1.0.${{ github.run_number }}
        files: WordPowerTools-Addin-Release.zip
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}