name: Build VSTO Word Add-in

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Locate Visual Studio and VSTO targets
      run: |
        $ErrorActionPreference = "Stop"
        $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
        $installPath = (& $vswhere -latest -products * -property installationPath | Select-Object -First 1).Trim()

        if (-not $installPath) {
          throw "Visual Studio not found on the GitHub runner."
        }

        $targetsFile = Get-ChildItem "$installPath\MSBuild\Microsoft\VisualStudio" -Filter "Microsoft.VisualStudio.Tools.Office.targets" -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
        if (-not $targetsFile) {
          throw "VSTO build targets are not installed in $installPath. Install the Visual Studio Office/SharePoint development tools on the runner image."
        }

        $officeToolsPath = $targetsFile.Directory.FullName
        $vsToolsPath = Split-Path $officeToolsPath -Parent
        $vsVersionDirectory = Split-Path $vsToolsPath -Leaf
        $vsVersion = $vsVersionDirectory -replace '^v', ''
        Write-Host "VSTO targets: $($targetsFile.FullName)"
        Write-Host "Visual Studio version: $vsVersion"
        $referenceAssembly = Get-ChildItem $installPath -Filter "Microsoft.Office.Tools.Word.v4.0.Utilities.dll" -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
        if (-not $referenceAssembly) {
          throw "Microsoft.Office.Tools.Word.v4.0.Utilities.dll was not found under $installPath."
        }
        $referenceAssembliesPath = $referenceAssembly.Directory.FullName
        $requiredAssemblies = @(
          "Microsoft.Office.Tools.dll"
          "Microsoft.Office.Tools.Common.dll"
          "Microsoft.Office.Tools.Common.v4.0.Utilities.dll"
          "Microsoft.Office.Tools.v4.0.Framework.dll"
          "Microsoft.Office.Tools.Word.dll"
          "Microsoft.Office.Tools.Word.v4.0.Utilities.dll"
        )
        foreach ($assembly in $requiredAssemblies) {
          if (-not (Test-Path (Join-Path $referenceAssembliesPath $assembly))) {
            throw "$assembly was not found in $referenceAssembliesPath."
          }
        }
        Write-Host "VSTO reference assemblies: $referenceAssembliesPath"

        "VSTO_TOOLS_PATH=$vsToolsPath" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
        "VS_VERSION=$vsVersion" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
        "VSTO_REFERENCE_ASSEMBLIES_PATH=$referenceAssembliesPath" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
      shell: powershell

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2

    - name: Setup NuGet
      uses: nuget/setup-nuget@v2

    - name: Restore NuGet Packages
      run: nuget restore WordPowerToolsAddin.sln

    - name: Build VSTO Project
      run: |
        $ErrorActionPreference = "Stop"
        msbuild WordPowerToolsAddin\WordPowerToolsAddin.csproj /t:Rebuild /p:Configuration=Release /p:Platform="AnyCPU" /p:VisualStudioVersion="$env:VS_VERSION" /p:VSToolsPath="$env:VSTO_TOOLS_PATH" /p:VSTOReferenceAssembliesPath="$env:VSTO_REFERENCE_ASSEMBLIES_PATH" /p:ReferencePath="$env:VSTO_REFERENCE_ASSEMBLIES_PATH" /v:normal "/flp:LogFile=msbuild.log;Verbosity=diagnostic"
        if ($LASTEXITCODE -ne 0) {
          Write-Host "===== MSBUILD ERRORS ====="
          $errors = Get-Content msbuild.log | Where-Object { $_ -match '(?i)error|MSB[0-9]+|CS[0-9]+' }
          if (-not $errors) {
            $errors = Get-Content msbuild.log | Select-Object -Last 80
          }
          foreach ($errorLine in ($errors | Select-Object -First 80)) {
            Write-Host $errorLine
            Write-Host "::error file=WordPowerToolsAddin/WordPowerToolsAddin.csproj::$($errorLine.Trim())"
          }
          Write-Host "===== END MSBUILD ERRORS ====="
          throw "MSBuild failed with exit code $LASTEXITCODE."
        }
      shell: powershell

    - name: Upload build log on failure
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: msbuild-log
        path: msbuild.log
        if-no-files-found: ignore

    - name: Publish Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: WordPowerTools-Addin-Artifacts
        path: WordPowerToolsAddin\bin\Release\

    - name: Zip Files for Release
      run: Compress-Archive -Path WordPowerToolsAddin\bin\Release\* -DestinationPath WordPowerTools-Addin-Release.zip
      shell: powershell

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
      with:
        tag_name: v1.0.${{ github.run_number }}
        name: Release v1.0.${{ github.run_number }}
        files: WordPowerTools-Addin-Release.zip
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}