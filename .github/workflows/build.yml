name: Build VSTO Word Add-in

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v3

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v1.1

    - name: Setup NuGet
      uses: NuGet/setup-nuget@v1.2.2

    - name: Restore NuGet Packages
      run: nuget restore WordPowerToolsAddin.sln

    - name: Build VSTO Project
      run: msbuild WordPowerToolsAddin\WordPowerToolsAddin.csproj /p:Configuration=Release /p:Platform="AnyCPU"

    - name: Publish Artifacts
      uses: actions/upload-artifact@v3
      with:
        name: WordPowerTools-Addin-Release
        path: WordPowerToolsAddin\bin\Release\