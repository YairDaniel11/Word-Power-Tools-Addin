name: Build VSTO Word Add-in

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2

    - name: Setup NuGet
      uses: nuget/setup-nuget@v2

    - name: Restore NuGet Packages
      run: nuget restore WordPowerToolsAddin.sln

    - name: Build VSTO Project
      # הוספנו כאן את הגדרת הגרסה הקשיחה ל-17.0 כדי לפתור את בעיית הנתיבים של VSTO
      run: msbuild WordPowerToolsAddin\WordPowerToolsAddin.csproj /p:Configuration=Release /p:Platform="AnyCPU" /p:VisualStudioVersion=17.0

    - name: Publish Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: WordPowerTools-Addin-Release
        path: WordPowerToolsAddin\bin\Release\